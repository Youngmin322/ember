<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">실내 지도 데이터와 사용자 위치</title>
  <desc id="desc">실내 지도 화면 안에서 지도 데이터와 현재 사용자 위치를 구분해 보여 주는 다이어그램</desc>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Indoor map screen -->
  <rect x="155" y="105" width="925" height="690" rx="30" fill="#FCFCFD" stroke="#20242C" stroke-width="4"/>
  <text x="617.5" y="205" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
        font-size="44" font-weight="700" fill="#20242C">실내 지도 화면</text>

  <!-- Simple map data -->
  <g fill="none" stroke="#B8BEC8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="265" y="295" width="705" height="275" rx="8"/>
    <path d="M475 295V405 M475 475V570 M740 295V380 M740 450V570"/>
    <path d="M475 430H740" stroke-dasharray="13 15"/>
    <path d="M620 570V660H970"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
     font-size="32" font-weight="600" fill="#5D6470" text-anchor="middle">
    <text x="370" y="435">방</text>
    <text x="608" y="380">복도</text>
    <text x="855" y="435">화장실</text>
    <text x="620" y="625" font-size="27" font-weight="500">문</text>
  </g>

  <!-- Current device location -->
  <circle cx="665" cy="510" r="35" fill="#1677FF" opacity="0.16"/>
  <circle cx="665" cy="510" r="18" fill="#1677FF" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" fill="#20242C">
    <path d="M970 350H1160" fill="none" stroke="#858C98" stroke-width="3" stroke-linecap="round"/>
    <circle cx="970" cy="350" r="6" fill="#858C98"/>
    <text x="1200" y="362" font-size="34" font-weight="650">지도 data</text>

    <path d="M700 510H1160" fill="none" stroke="#1677FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="700" cy="510" r="6" fill="#1677FF"/>
    <text x="1200" y="522" font-size="34" font-weight="650">사용자 위치</text>
  </g>
</svg>
